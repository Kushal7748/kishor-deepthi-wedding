<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1a1815" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Kishor V &amp; Deepthi V — Where Forever Begins</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500;1,600&family=DM+Sans:wght@400;500;600&family=Inter:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <audio
      id="bg-music-audio"
      src="/audio/bg-music.mp3"
      preload="auto"
      autoplay
      playsinline
      webkit-playsinline
      style="position:fixed;top:-9999px;left:-9999px;width:1px;height:1px;opacity:0;pointer-events:none;"
    ></audio>
    <script>
      (function() {
        var audio = document.getElementById('bg-music-audio');
        var unlocked = false;

        function tryPlay() {
          if (!audio) return;
          audio.muted = false;
          audio.volume = 1.0;
          var p = audio.play();
          if (p !== undefined) {
            p.then(function() {
              unlocked = true;
              removeListeners();
            }).catch(function() {
              // Browser policy requires a user touch to unmute; start playing muted so it is preloaded
              audio.muted = true;
              audio.play().catch(function() {});
            });
          }
        }

        function unlock() {
          if (unlocked || !audio) return;
          audio.muted = false;
          audio.volume = 1.0;
          var p = audio.play();
          if (p !== undefined) {
            p.then(function() {
              unlocked = true;
              removeListeners();
            }).catch(function() {});
          }
        }

        var events = ['touchstart', 'touchend', 'click', 'pointerdown', 'mousedown', 'scroll', 'keydown'];
        function removeListeners() {
          events.forEach(function(ev) {
            window.removeEventListener(ev, unlock, true);
            document.removeEventListener(ev, unlock, true);
          });
        }

        events.forEach(function(ev) {
          window.addEventListener(ev, unlock, { capture: true, passive: true });
          document.addEventListener(ev, unlock, { capture: true, passive: true });
        });

        tryPlay();
        window.addEventListener('DOMContentLoaded', tryPlay);
        window.addEventListener('load', tryPlay);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
